    <script>
      (function() {
        var origDefineProperty = Object.defineProperty;
        Object.defineProperty = function(obj, prop, descriptor) {
          if ((obj === window || obj === globalThis) && prop === 'fetch' && descriptor) {
            var originalGet = descriptor.get;
            var originalSet = descriptor.set;
            var overridden = false;
            var currentVal;
            return origDefineProperty.call(Object, obj, prop, {
              configurable: true,
              enumerable: true,
              get: function() {
                return overridden ? currentVal : (originalGet ? originalGet.call(this) : descriptor.value);
              },
              set: function(val) {
                overridden = true;
                currentVal = val;
                if (originalSet) {
                  originalSet.call(this, val);
                }
              }
            });
          }
          return origDefineProperty.apply(Object, arguments);
        };
      })();
    </script>
